<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tabelid</title>
</head>
<body>
<h1>Tabelid</h1>
<h2>Lihtne tabel</h2>
<table id="Lihtne">
    <tr>
        <td>A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
    </table>
<h2>Tabel kus on uhendatud lahtrid</h2>
    <table id="Keeruline1">
<table>
    <tr>
        <td colspan="2">A</td>
    </tr>
    <tr>
        <td>C</td>
        <td>D</td>
    </tr>
</table>
<h2> veel uks Tabel kus on uhendatud lahtrid</h2>
<table id="Keeruline2">
<table>
    <tr>
        <td rowspan="2">A</td>
        <td>B</td>
    </tr>
    <tr>
        <td>D</td>
    </tr>
</table>

    <table>
        <tr>
            <td rowspan="4">A</td>
        </tr>
        <tr>
            <td colspan="3">D</td>
        </tr>
        <tr>
            <td>C</td>
            <td>D</td>
        </tr>
        <tr>
            <td colspan="2">f</td>
        </tr>
        <tr>
            <td colspan="2">g</td>
        </tr>
        <tr>
            <td rowspan="3">e</td>
        </tr>
    </table>

</body>
</html>
